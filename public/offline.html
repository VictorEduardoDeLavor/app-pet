<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a4fe3">
<title>Sem internet</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f2f0f9; color: #1d1a2b;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 340px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 20px 0 8px; letter-spacing: -0.01em; }
  p { margin: 0; color: #6c6880; font-size: 15px; line-height: 1.45; }
  button { margin-top: 24px; width: 100%; height: 52px; border: 0; border-radius: 16px; font-size: 15px; font-weight: 600;
           color: #fff; background: linear-gradient(180deg, #7b61ef 0%, #6447dc 100%); }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>Sem internet no momento</h1>
  <p>O app precisa de conexão para mostrar a agenda e os clientes atualizados. Assim que o sinal voltar, é só tentar de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
